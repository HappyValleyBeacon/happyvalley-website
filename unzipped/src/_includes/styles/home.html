<style>
  :root{
    --bg:#ffe4d6;--bg2:#fdecf6;--tint:#f7d7ec;
    --cyan:#00bfe0;--magenta:#ff2fb0;--orange:#ff7a2f;--violet:#7b3ff2;--yellow:#ffcc33;
    --ink:#241436;--muted:#6b5c86;--card:#ffffff;--line:rgba(36,20,54,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);line-height:1.55;overflow-x:hidden;background:
      radial-gradient(1000px 620px at 85% -6%,rgba(0,191,224,.36),transparent 55%),
      radial-gradient(900px 620px at -6% 14%,rgba(255,47,176,.30),transparent 55%),
      radial-gradient(950px 640px at 50% 110%,rgba(255,204,51,.38),transparent 55%),
      var(--bg);background-attachment:fixed}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px}

  header{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:rgba(255,228,214,.82);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:70px}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Bungee',sans-serif;font-size:19px;letter-spacing:.5px}
  .brand span{background:linear-gradient(90deg,var(--violet),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand img{height:42px;width:auto;display:block}
  nav.links{display:flex;gap:26px;align-items:center}
  nav.links a{font-size:13px;font-weight:600;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;transition:.2s}
  nav.links a:hover{color:var(--magenta)}
  .navcta{padding:10px 17px;border-radius:999px;background:linear-gradient(90deg,var(--magenta),var(--orange));color:#fff!important;font-weight:700;letter-spacing:.5px;box-shadow:0 6px 18px rgba(255,47,176,.35)}
  .menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:18px}

  .hero{position:relative;overflow:hidden;padding:80px 0 74px;text-align:center}
  .hero::before{content:"";position:absolute;inset:0;z-index:0;background:
      radial-gradient(760px 420px at 50% -12%,rgba(123,63,242,.16),transparent 62%),
      radial-gradient(560px 320px at 16% 34%,rgba(255,47,176,.14),transparent 62%),
      radial-gradient(560px 320px at 84% 40%,rgba(0,191,224,.16),transparent 62%)}
  .hero .wrap{position:relative;z-index:2}
  h1.sr-only,.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .logo{width:min(360px,80vw);margin:8px auto 14px;display:block;filter:drop-shadow(0 16px 34px rgba(123,63,242,.28))}
  .beam{animation:hover 4s ease-in-out infinite}
  @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .subtitle{font-family:'Bungee',sans-serif;font-size:clamp(18px,2.6vw,30px);letter-spacing:5px;text-transform:uppercase;
    background:linear-gradient(90deg,var(--violet),var(--magenta),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
  .place{margin-top:12px;color:var(--muted);letter-spacing:1px;font-size:15px}
  .cta-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:26px}
  .btn{padding:15px 30px;border-radius:999px;font-weight:700;letter-spacing:.5px;font-size:15px;transition:.2s;display:inline-block}
  .btn.primary{background:linear-gradient(90deg,var(--magenta),var(--orange));color:#fff;box-shadow:0 10px 24px rgba(255,47,176,.35)}
  .btn.primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(255,47,176,.5)}
  .btn.ghost{background:#fff;border:2px solid var(--violet);color:var(--violet);box-shadow:0 6px 18px rgba(123,63,242,.15)}
  .btn.ghost:hover{background:var(--violet);color:#fff;transform:translateY(-2px)}

  .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:1200px;margin:0 auto;padding:0 24px;transform:translateY(-4px)}
  .strip .cell{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;text-align:center;box-shadow:0 10px 30px rgba(36,20,54,.06)}
  .strip .k{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--violet);font-weight:700;margin-bottom:8px}
  .strip .v{font-size:16px;font-weight:600}
  .strip .v small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:2px}

  section.block{padding:82px 0}
  .sec-head{text-align:center;max-width:640px;margin:0 auto 46px}
  .sec-head .tag{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--magenta);font-weight:700}
  .sec-head h2{font-family:'Bungee',sans-serif;font-size:clamp(28px,5vw,46px);margin:12px 0;letter-spacing:1px;
    background:linear-gradient(90deg,var(--violet),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sec-head p{color:var(--muted);font-size:16px}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:.25s;box-shadow:0 12px 30px rgba(36,20,54,.07)}
  .card:hover{transform:translateY(-6px);box-shadow:0 22px 50px rgba(123,63,242,.18)}
  .card .thumb{height:200px;position:relative;display:flex;align-items:flex-end;padding:16px;font-family:'Bungee',sans-serif;font-size:20px;letter-spacing:1px;background-size:cover;background-position:center;color:#fff}
  .card .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(20,8,42,.8))}
  .card .thumb span{position:relative;z-index:2}
  .card .body{padding:20px}
  .card .body p{color:var(--muted);font-size:14.5px}

  .feature{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 16px 40px rgba(36,20,54,.09)}
  .feature .photo{min-height:440px;background-size:cover;background-position:center}
  .feature .text{padding:52px 44px;display:flex;flex-direction:column;justify-content:center}
  .feature .tag{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--magenta);font-weight:700;margin-bottom:12px}
  .feature h2{font-family:'Bungee',sans-serif;font-size:clamp(24px,4vw,38px);margin-bottom:16px;
    background:linear-gradient(90deg,var(--violet),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
  .feature p{color:var(--muted);font-size:16px;margin-bottom:14px}
  .menu-mini{display:flex;flex-direction:column;gap:9px;margin:8px 0 26px}
  .menu-mini .mi{display:flex;justify-content:space-between;gap:16px;border-bottom:1px dashed var(--line);padding-bottom:9px;font-size:15px}
  .menu-mini .mi b{color:var(--ink);font-weight:600}
  .menu-mini .mi span{color:var(--magenta);font-weight:700}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
  .split .art{height:400px;border-radius:24px;border:1px solid var(--line);background-size:cover;background-position:center;box-shadow:0 22px 50px rgba(36,20,54,.14)}
  .split h3{font-family:'Bungee',sans-serif;font-size:clamp(24px,4vw,38px);margin-bottom:14px;
    background:linear-gradient(90deg,var(--orange),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
  .split p{color:var(--muted);margin-bottom:22px;font-size:16px}
  .pill-list{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
  .pill{border:1.5px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13px;color:var(--violet);font-weight:600;background:#fff}

  .gal{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  .gal a{aspect-ratio:1;border-radius:16px;background-size:cover;background-position:center;border:2px solid #fff;box-shadow:0 8px 22px rgba(36,20,54,.10);transition:.25s}
  .gal a:hover{transform:scale(1.05) rotate(-1deg);box-shadow:0 14px 30px rgba(255,47,176,.28)}
  .gal a.wide{grid-column:span 2;aspect-ratio:2}

  .mug{background:linear-gradient(135deg,var(--violet),var(--magenta));border-radius:28px;padding:58px 40px;text-align:center;box-shadow:0 20px 50px rgba(123,63,242,.3)}
  .mug h3{font-family:'Monoton',cursive;font-size:clamp(30px,6vw,58px);color:var(--yellow);margin-bottom:14px;text-shadow:0 3px 0 rgba(0,0,0,.15)}
  .mug p{color:#fff;max-width:560px;margin:0 auto 26px;font-size:16px}
  .mug .btn.solid{background:#fff;color:var(--violet)}
  .mug .btn.solid:hover{transform:translateY(-2px);background:var(--yellow);color:var(--ink)}

  .hours-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,auto);grid-auto-flow:column;gap:8px 40px;max-width:520px;margin:0 auto}
  .hours-grid .row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
  .hours-grid .row b{color:var(--violet);letter-spacing:1px}
  .note{text-align:center;color:var(--muted);margin-top:24px;font-size:14px;max-width:520px;margin-left:auto;margin-right:auto}

  footer{border-top:1px solid var(--line);padding:60px 0 40px;background:var(--tint)}
  .foot{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px}
  .foot .brand{margin-bottom:16px}
  .foot p{color:var(--muted);font-size:14.5px;margin-bottom:6px}
  .foot h4{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--violet);font-weight:700;margin-bottom:14px}
  .foot a{display:block;color:var(--muted);font-size:14.5px;margin-bottom:9px;transition:.2s}
  .foot a:hover{color:var(--magenta)}
  .copy{text-align:center;color:var(--muted);font-size:13px;margin-top:44px;padding-top:22px;border-top:1px solid var(--line)}

  @media(max-width:860px){
    nav.links{display:none}
    .menu-btn{display:block}
    .strip,.cards,.split,.foot,.hours-grid{grid-template-columns:1fr}
    .hours-grid{grid-template-rows:auto;grid-auto-flow:row}
    .feature{grid-template-columns:1fr}
    .feature .photo{min-height:260px}
    .gal{grid-template-columns:repeat(3,1fr)}
    .gal a.wide{grid-column:span 2;aspect-ratio:2}
  }
  .social{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .social a{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600;letter-spacing:.3px;color:var(--ink);transition:.2s}
  .social a:hover{border-color:var(--magenta);color:var(--magenta);transform:translateY(-1px);box-shadow:0 6px 16px rgba(255,47,176,.18)}
  .social svg{width:16px;height:16px;fill:currentColor;flex:0 0 auto}
  .nav{position:relative}
  @media(max-width:860px){
    nav.links.open{display:flex;flex-direction:column;align-items:stretch;gap:2px;position:absolute;top:calc(100% + 10px);right:0;left:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 18px 44px rgba(36,20,54,.18);z-index:120}
    nav.links.open a{display:block;width:100%;padding:13px 14px;border-radius:10px;font-size:14px;letter-spacing:1px}
    nav.links.open a:hover,nav.links.open a.active{background:var(--tint);color:var(--magenta)}
    nav.links.open a.navcta{margin-top:6px;text-align:center}
    .menu-btn{cursor:pointer;line-height:1;min-width:42px;min-height:42px}
  }
  .gal a{cursor:zoom-in}
  .lb{position:fixed;inset:0;z-index:200;background:rgba(20,8,32,.92);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px}
  .lb.open{display:flex}
  .lb-fig{position:relative;max-width:min(1100px,92vw);max-height:88vh;display:flex;flex-direction:column;align-items:center;gap:14px}
  .lb-img{max-width:100%;max-height:80vh;border-radius:16px;border:3px solid #fff;box-shadow:0 24px 70px rgba(0,0,0,.5);background:#241436;object-fit:contain}
  .lb-btn{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border:none;border-radius:50%;background:rgba(255,255,255,.92);color:var(--ink);font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;box-shadow:0 8px 22px rgba(0,0,0,.35)}
  .lb-btn:hover{background:var(--yellow);transform:translateY(-50%) scale(1.06)}
  .lb-prev{left:-70px}
  .lb-next{right:-70px}
  .lb-close{position:fixed;top:20px;right:22px;width:48px;height:48px;border:none;border-radius:50%;background:rgba(255,255,255,.92);color:var(--ink);font-size:24px;line-height:1;cursor:pointer;transition:.2s;box-shadow:0 8px 22px rgba(0,0,0,.35)}
  .lb-close:hover{background:var(--magenta);color:#fff;transform:rotate(90deg)}
  @media(max-width:860px){.lb-prev{left:6px}.lb-next{right:6px}.lb-btn{width:44px;height:44px}}
</style>
