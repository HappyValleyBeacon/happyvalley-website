<style>
  :root{--bg:#ffe4d6;--bg2:#fdecf6;--tint:#f7d7ec;--cyan:#00bfe0;--magenta:#ff2fb0;--orange:#ff7a2f;--violet:#7b3ff2;--yellow:#ffcc33;--ink:#241436;--muted:#6b5c86;--card:#ffffff;--line:rgba(36,20,54,.12);}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);line-height:1.55;overflow-x:hidden;background:
      radial-gradient(1000px 620px at 85% -6%,rgba(0,191,224,.36),transparent 55%),
      radial-gradient(900px 620px at -6% 14%,rgba(255,47,176,.30),transparent 55%),
      radial-gradient(950px 640px at 50% 110%,rgba(255,204,51,.38),transparent 55%),var(--bg);background-attachment:fixed}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px}
  header{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:rgba(255,228,214,.9);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:70px}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Bungee',sans-serif;font-size:19px;letter-spacing:.5px}
  .brand span{background:linear-gradient(90deg,var(--violet),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand img{height:42px;width:auto;display:block}
  nav.links{display:flex;gap:26px;align-items:center}
  nav.links a{font-size:13px;font-weight:600;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;transition:.2s}
  nav.links a.active,nav.links a:hover{color:var(--magenta)}
  .navcta{padding:10px 17px;border-radius:999px;background:linear-gradient(90deg,var(--magenta),var(--orange));color:#fff!important;font-weight:700;letter-spacing:.5px;box-shadow:0 6px 18px rgba(255,47,176,.35)}
  .menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:18px}
  .btn{padding:14px 28px;border-radius:999px;font-weight:700;letter-spacing:.5px;font-size:15px;transition:.2s;display:inline-block}
  .btn.primary{background:linear-gradient(90deg,var(--magenta),var(--orange));color:#fff;box-shadow:0 10px 24px rgba(255,47,176,.35)}
  .btn.primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(255,47,176,.5)}
  .btn.mini{padding:10px 18px;font-size:13px;background:#fff;border:2px solid var(--violet);color:var(--violet)}
  .btn.mini:hover{background:var(--violet);color:#fff}
  .mhead{position:relative;text-align:center;padding:64px 0 26px;overflow:hidden}
  .mhead::before{content:"";position:absolute;inset:0;z-index:0;background:
      radial-gradient(700px 360px at 50% -18%,rgba(123,63,242,.16),transparent 62%),
      radial-gradient(520px 300px at 12% 40%,rgba(255,47,176,.14),transparent 62%),
      radial-gradient(520px 300px at 88% 40%,rgba(0,191,224,.16),transparent 62%)}
  .mhead .wrap{position:relative;z-index:2}
  .mhead .eyebrow{display:inline-block;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--magenta);font-weight:700;margin-bottom:16px}
  .mhead h1{font-family:'Monoton',cursive;font-size:clamp(40px,9vw,84px);line-height:1;background:linear-gradient(90deg,var(--violet),var(--magenta),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
  .mhead p{color:var(--muted);margin-top:14px;font-size:15px;max-width:600px;margin-left:auto;margin-right:auto}
  section.block{padding:40px 0}
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:44px}
  .cat{position:relative;height:220px;border-radius:22px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(36,20,54,.12);transition:.25s}
  .cat:hover{transform:translateY(-4px)}
  .cat span{position:relative;z-index:2;font-family:'Bungee',sans-serif;font-size:26px;color:#fff;letter-spacing:1px;text-shadow:0 2px 12px rgba(0,0,0,.25)}
  .c1{background:linear-gradient(135deg,var(--magenta),var(--orange))}
  .c2{background:linear-gradient(135deg,var(--violet),var(--cyan))}
  .sec-head{text-align:center;max-width:640px;margin:0 auto 34px}
  .sec-head .tag{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--magenta);font-weight:700}
  .sec-head h2{font-family:'Bungee',sans-serif;font-size:clamp(24px,5vw,38px);margin:12px 0;letter-spacing:1px;background:linear-gradient(90deg,var(--violet),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sec-head p{color:var(--muted);font-size:16px}
  .prods{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .prod{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 12px 30px rgba(36,20,54,.07);transition:.25s;display:flex;flex-direction:column}
  .prod:hover{transform:translateY(-6px);box-shadow:0 22px 50px rgba(123,63,242,.16)}
  .prod .thumb{height:240px;display:flex;align-items:center;justify-content:center;font-family:'Bungee',sans-serif;color:#fff;font-size:22px;letter-spacing:1px;text-align:center;padding:20px;text-shadow:0 2px 10px rgba(0,0,0,.2)}
  .t1{background:linear-gradient(135deg,#ff2fb0,#ff7a2f)}
  .t2{background:linear-gradient(135deg,#241436,#7b3ff2)}
  .t3{background:linear-gradient(135deg,#00bfe0,#7b3ff2)}
  .t4{background:linear-gradient(135deg,#ffcc33,#ff7a2f)}
  .t5{background:linear-gradient(135deg,#7b3ff2,#ff2fb0)}
  .t6{background:linear-gradient(135deg,#00bfe0,#2fffb0)}
  .prod .in{padding:20px 22px 24px;display:flex;flex-direction:column;gap:6px;height:100%}
  .prod h3{font-size:17px;font-weight:600}
  .prod .desc{color:var(--muted);font-size:14px;margin-bottom:12px}
  .prod .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .prod .price{font-family:'Bungee',sans-serif;color:var(--violet);font-size:15px}
  .cta-band{background:linear-gradient(135deg,var(--violet),var(--magenta));border-radius:28px;padding:52px 40px;text-align:center;box-shadow:0 20px 50px rgba(123,63,242,.3);margin-top:44px}
  .cta-band h3{font-family:'Bungee',sans-serif;font-size:clamp(24px,5vw,38px);color:#fff;margin-bottom:14px}
  .cta-band p{color:#fff;opacity:.95;max-width:560px;margin:0 auto 26px;font-size:16px}
  .cta-band .btn.solid{background:#fff;color:var(--violet)}
  .cta-band .btn.solid:hover{transform:translateY(-2px);background:var(--yellow);color:var(--ink)}
  footer{border-top:1px solid var(--line);padding:56px 0 40px;background:var(--tint);margin-top:40px}
  .foot{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px}
  .foot .brand{margin-bottom:16px}
  .foot p{color:var(--muted);font-size:14.5px;margin-bottom:6px}
  .foot h4{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--violet);font-weight:700;margin-bottom:14px}
  .foot a{display:block;color:var(--muted);font-size:14.5px;margin-bottom:9px;transition:.2s}
  .foot a:hover{color:var(--magenta)}
  .copy{text-align:center;color:var(--muted);font-size:13px;margin-top:44px;padding-top:22px;border-top:1px solid var(--line)}
  @media(max-width:860px){nav.links{display:none}.menu-btn{display:block}.cats,.prods,.foot{grid-template-columns:1fr}}
  .social{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .social a{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600;letter-spacing:.3px;color:var(--ink);transition:.2s}
  .social a:hover{border-color:var(--magenta);color:var(--magenta);transform:translateY(-1px);box-shadow:0 6px 16px rgba(255,47,176,.18)}
  .social svg{width:16px;height:16px;fill:currentColor;flex:0 0 auto}
  .nav{position:relative}
  @media(max-width:860px){
    nav.links.open{display:flex;flex-direction:column;align-items:stretch;gap:2px;position:absolute;top:calc(100% + 10px);right:0;left:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 18px 44px rgba(36,20,54,.18);z-index:120}
    nav.links.open a{display:block;width:100%;padding:13px 14px;border-radius:10px;font-size:14px;letter-spacing:1px}
    nav.links.open a:hover,nav.links.open a.active{background:var(--tint);color:var(--magenta)}
    nav.links.open a.navcta{margin-top:6px;text-align:center}
    .menu-btn{cursor:pointer;line-height:1;min-width:42px;min-height:42px}
  }
</style>
