eyebrow: What's On
heading: Events
intro: Trivia, karaoke, comedy, and tournaments all season long. One-off nights and special dates drop on Instagram — follow along or give us a call.
rotating_heading: More Ways to Play
rotating_note: These pop up throughout the season. Dates and lineups are announced on Instagram — follow us so you don't miss one.
rotating:
  - title: Geeks Who Drink Trivia
    when: Tuesdays · 6:30pm
    description: Come early, grab a seat, and show your inner geek. Free to play, drinks flowing, and bragging rights on the line every week.
  - title: Karaoke Dance Party
    when: Dates on Instagram
    description: Grab the mic and the dance floor. Belt your heart out with a drink in hand and the whole bar backing you up.
  - title: Comedy at the 'Cade
    when: Select Nights · Ticketed
    description: Stand-up among the cabinets. Doors early, show after — grab tickets and a table before they fill up.
  - title: Arcade Tournaments
    when: Dates on Instagram
    description: Bracket nights on the floor — pinball and fighter showdowns with prizes for the top scores.
  - title: Live DJs & Pop-Ups
    when: Weekends · Rotating
    description: Late-night sets, guest pop-ups, and one-off collabs that turn the floor up on Friday and Saturday nights.
courtyard:
  title: Book the Courtyard
  description: Out front on Main Street, our string-lit Happy Huts are cozy and made for groups. Reserve a hut for a birthday, a team night, or just a better seat to the action.
